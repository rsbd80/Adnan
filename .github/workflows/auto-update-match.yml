name: RS Auto Update
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update Matches
        run: |
          python scripts/update_all_matches.py || echo "Match update skipped, no problem"
          python scripts/update_channels.py || echo "Channel update skipped, no problem"
      - name: Save
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update"
          git push || echo "Push failed, will retry"
